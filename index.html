<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikmin Mod Hub - The Canopy</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-logo">🌿 Pikmin Mod Hub</h1>
            <ul class="nav-menu">
                <li><a href="index.html" class="active">Canopy</a></li>
                <li><a href="mod-den.html" id="modDenLink" style="display:none;">Mod Den</a></li>
                <li id="authLink"><a href="javascript:void(0)" onclick="openLogin()">Login</a></li>
                <li id="logoutLink" style="display:none;"><a href="javascript:void(0)" onclick="logout()">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <section class="hero">
            <h2>The Canopy</h2>
            <p>Featured Pikmin Mods - Curated by the Admin</p>
        </section>

        <!-- Admin Panel (only visible to admin) -->
        <section id="adminPanel" class="admin-panel" style="display:none;">
            <h3>🎨 Admin Controls - Upload Featured Mods</h3>
            <form id="uploadForm" class="upload-form">
                <div class="form-group">
                    <label for="modName">Mod Name:</label>
                    <input type="text" id="modName" placeholder="Enter mod name" required>
                </div>
                <div class="form-group">
                    <label for="modDescription">Description:</label>
                    <textarea id="modDescription" rows="4" placeholder="Describe this amazing mod..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="modFile">Mod File (ZIP):</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="modFile" accept=".zip" required>
                        <span class="file-label">Choose File</span>
                    </div>
                </div>
                <button type="submit" class="btn-primary btn-large">📤 Upload to Canopy</button>
            </form>
        </section>

        <!-- Featured Mods Display -->
        <section class="featured-section">
            <h3>✨ Featured Mods</h3>
            <div class="mods-grid" id="modsGrid">
                <!-- Mods will be loaded here -->
            </div>
        </section>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close" onclick="closeLogin()">&times;</span>
            <h2>🔐 Login to Pikmin Mod Hub</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn-primary btn-full">Login</button>
                <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem;">Demo: kaanpikmin / admin</p>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="script.js"></script>
</body>
</html>
